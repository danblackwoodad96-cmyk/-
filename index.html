<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Записи из Кофейни</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1e9;
      --surface: #fffdf9;
      --surface-alt: #efe8dc;
      --text: #2b241d;
      --text-muted: #6e6256;
      --accent: #7c4d2b;
      --accent-hover: #5e381d;
      --border: #e2d7c7;
      --shadow: 0 8px 28px rgba(43, 36, 29, 0.06);
    }

    [data-theme="dark"] {
      --bg: #181512;
      --surface: #221e1a;
      --surface-alt: #2b2621;
      --text: #ebe3d8;
      --text-muted: #a39687;
      --accent: #d49b6a;
      --accent-hover: #e3b084;
      --border: #362f29;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    header {
      text-align: center;
      padding: 28px 0 36px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--surface-alt);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 520px;
      margin: 0 auto 24px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--accent);
      color: #fffdf9;
      border-color: var(--accent);
    }

    [data-theme="dark"] .btn-primary {
      color: #181512;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .search-input {
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .page-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill.active, .pill:hover {
      background: var(--accent);
      color: #fffdf9;
      border-color: var(--accent);
    }

    [data-theme="dark"] .pill.active,
    [data-theme="dark"] .pill:hover {
      color: #181512;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 30px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border);
    }

    .page-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .date-tag {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--surface-alt);
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 500;
    }

    .note-body {
      font-size: 15.5px;
      white-space: pre-line;
    }

    .author-note {
      display: inline-block;
      margin-top: 12px;
      font-size: 13.5px;
      font-style: italic;
      color: var(--text-muted);
      background: var(--surface-alt);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .reply-block {
      margin-top: 1
